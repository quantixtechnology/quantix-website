# ============================================================================
# Quantix Technology — Production Nginx Configuration
# quantixtechnology.in / www  → port 3001 (Next.js marketing website)
# app.quantixtechnology.in    → port 3000 (Quantix Core backend)
# ============================================================================
#
# File location: /etc/nginx/sites-available/quantix
# Test with   : sudo nginx -t
# Reload with : sudo systemctl reload nginx
# ============================================================================

# ── Rate limiting ────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=website:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api:10m     rate=10r/s;

# ── Upstreams ─────────────────────────────────────────────────────────────────
upstream website_upstream {
    server 127.0.0.1:3001;
    keepalive 64;
}

upstream app_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ── 1. HTTP — redirect everything to HTTPS ───────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name quantixtechnology.in www.quantixtechnology.in app.quantixtechnology.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 2. HTTPS non-www — redirect to www ───────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quantixtechnology.in;

    ssl_certificate     /etc/letsencrypt/live/quantixtechnology.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantixtechnology.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.quantixtechnology.in$request_uri;
}

# ── 3. HTTPS www — marketing website (port 3001) ─────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.quantixtechnology.in;

    ssl_certificate     /etc/letsencrypt/live/quantixtechnology.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantixtechnology.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    access_log /var/log/nginx/quantix-website.access.log;
    error_log  /var/log/nginx/quantix-website.error.log warn;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/xml
        font/truetype font/opentype image/svg+xml;

    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;
    proxy_connect_timeout   60s;
    proxy_send_timeout      60s;
    proxy_read_timeout      60s;

    location /_next/static/ {
        proxy_pass http://website_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_pass http://website_upstream;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~* \.(png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|ttf|eot|otf)$ {
        proxy_pass http://website_upstream;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        access_log off;
    }

    location / {
        limit_req zone=website burst=30 nodelay;
        proxy_pass http://website_upstream;
    }
}

# ── 4. HTTPS app — backend (port 3000) ───────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.quantixtechnology.in;

    ssl_certificate     /etc/letsencrypt/live/quantixtechnology.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantixtechnology.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/quantix-app.access.log;
    error_log  /var/log/nginx/quantix-app.error.log warn;

    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://app_upstream;
    }
}
