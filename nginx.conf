# Nginx server block for quantixtechnology.in
# Place this file at: /etc/nginx/sites-available/quantix-website
# Then: sudo ln -s /etc/nginx/sites-available/quantix-website /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name quantixtechnology.in www.quantixtechnology.in;

    # Redirect www → non-www
    if ($host = www.quantixtechnology.in) {
        return 301 https://quantixtechnology.in$request_uri;
    }

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Cache static assets from Next.js
    location /_next/static/ {
        proxy_pass http://localhost:3001;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve public folder assets
    location /logo.png {
        proxy_pass http://localhost:3001;
        add_header Cache-Control "public, max-age=86400";
    }
}

# HTTPS block is added automatically by Certbot after running:
# sudo certbot --nginx -d quantixtechnology.in -d www.quantixtechnology.in
